name: RIDM Ultra CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          uv pip install --system -e ".[llm,serving,dev]" pytest pytest-asyncio pytest-cov httpx

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Black Code Format Check
        run: |
          black --check .

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=. pytest tests/ --cov=ridm_ultra --cov-report=xml -v
