# SonarQube Project Configuration for RIDM Ultra v6
sonar.projectKey=ridm-ultra
sonar.projectName=RIDM Ultra
sonar.projectVersion=6.0.0
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=.,native,ridm_ultra
sonar.exclusions=**/build/**,**/*.exe,**/*.dll,**/*.dylib,**/*.so,**/*.npz,**/*.sqlite,**/artifacts/**,**/scratch/**,**/.git/**

# Python configuration
sonar.python.version=3.10,3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml

# C/C++ configuration
sonar.c.file.suffixes=.c,.h
sonar.cpp.file.suffixes=.cpp,.hpp,.cc
